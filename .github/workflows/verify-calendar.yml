name: Verify interactive calendar

on:
  push:
    branches: [feat/interactive-korean-calendar]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: verify-interactive-calendar-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install
        run: npm ci --no-audit --no-fund

      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build > build.log 2>&1

      - name: Commit verified package lock
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]' && steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "검증된 캘린더 의존성 잠금 파일 갱신"
          git push

      - name: Upload verification files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-calendar-verification
          path: |
            package-lock.json
            build.log
          if-no-files-found: error

      - name: Fail when build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
