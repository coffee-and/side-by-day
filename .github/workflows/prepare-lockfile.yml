name: Prepare npm lockfile

on:
  push:
    branches: [chore/lock-dependencies]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: prepare-npm-lockfile
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/lock-dependencies

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install
        run: npm ci --no-audit --no-fund

      - name: Verify production build
        id: build
        continue-on-error: true
        run: npm run build > build.log 2>&1

      - name: Commit lockfile and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json build.log
          git commit -m "npm 잠금 파일과 빌드 진단 추가"
          git push

      - name: Fail when build verification failed
        if: steps.build.outcome == 'failure'
        run: exit 1
