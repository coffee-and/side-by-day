name: Prepare npm lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/lock-dependencies

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install
        run: npm ci --no-audit --no-fund

      - name: Verify production build
        id: build
        continue-on-error: true
        run: npm run build > build.log 2>&1

      - name: Upload lockfile and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile-diagnostics
          path: |
            package-lock.json
            build.log
          if-no-files-found: error

      - name: Fail when build verification failed
        if: steps.build.outcome == 'failure'
        run: exit 1
