name: Prepare npm lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/lock-dependencies

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install
        run: npm ci --no-audit --no-fund

      - name: Verify production build
        run: npm run build

      - name: Commit verified lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lockfile_content="$(base64 -w 0 package-lock.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/package-lock.json" \
            -f message='검증된 npm 잠금 파일 추가' \
            -f content="$lockfile_content" \
            -f branch='chore/lock-dependencies'
