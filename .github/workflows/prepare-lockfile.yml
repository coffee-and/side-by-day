name: Prepare npm lockfile

on:
  push:
    branches: [chore/lock-dependencies]

permissions:
  contents: write

concurrency:
  group: prepare-npm-lockfile
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/lock-dependencies

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install
        run: npm ci --no-audit --no-fund

      - name: Verify production build
        run: npm run build

      - name: Commit verified lockfile
        run: |
          rm .github/workflows/prepare-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "검증된 npm 잠금 파일 추가"
          git push
